services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/01-runtime-role.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:-cloud_security_runtime}
      RLS_ENFORCEMENT_REQUIRED: ${RLS_ENFORCEMENT_REQUIRED:-true}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      PLATFORM_DIAGNOSTICS_ENABLED: ${PLATFORM_DIAGNOSTICS_ENABLED:-false}
      EVENT_INGEST_API_KEY: ${EVENT_INGEST_API_KEY}
      EVENT_QUEUE_BATCH_SIZE: ${EVENT_QUEUE_BATCH_SIZE:-25}
      EVENT_QUEUE_POLL_SECONDS: ${EVENT_QUEUE_POLL_SECONDS:-2.0}
      EVENT_QUEUE_MAX_ATTEMPTS: ${EVENT_QUEUE_MAX_ATTEMPTS:-5}
      EVENT_QUEUE_LOCK_TIMEOUT_SECONDS: ${EVENT_QUEUE_LOCK_TIMEOUT_SECONDS:-300}
      EVENT_QUEUE_RETRY_BASE_SECONDS: ${EVENT_QUEUE_RETRY_BASE_SECONDS:-10}
      EVENT_QUEUE_ALERT_AGE_SECONDS: ${EVENT_QUEUE_ALERT_AGE_SECONDS:-300}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10}
      AUTH_SESSION_EXPIRE_DAYS: ${AUTH_SESSION_EXPIRE_DAYS:-7}
      AUTH_MAX_FAILED_LOGINS: ${AUTH_MAX_FAILED_LOGINS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-strict}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:-}
      AUTH_MFA_ISSUER: ${AUTH_MFA_ISSUER:-Cloud Sentinel}
      AUTH_MFA_CHALLENGE_MINUTES: ${AUTH_MFA_CHALLENGE_MINUTES:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      AUTH_RATE_LIMIT_BLOCK_SECONDS: ${AUTH_RATE_LIMIT_BLOCK_SECONDS:-900}
      AUTH_RATE_LIMIT_PRINCIPAL_ATTEMPTS: ${AUTH_RATE_LIMIT_PRINCIPAL_ATTEMPTS:-10}
      AUTH_RATE_LIMIT_IP_ATTEMPTS: ${AUTH_RATE_LIMIT_IP_ATTEMPTS:-50}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-172.16.0.0/12,127.0.0.0/8}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256}
      OIDC_ALLOW_EMAIL_LINKING: ${OIDC_ALLOW_EMAIL_LINKING:-false}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      AWS_REGION: ${AWS_REGION}
      ALERT_CONSOLE_NOTIFICATIONS: ${ALERT_CONSOLE_NOTIFICATIONS}
      ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_ORGANIZATION_ID: ${ALERT_WEBHOOK_ORGANIZATION_ID:-1}
      ALERT_WEBHOOK_TIMEOUT: ${ALERT_WEBHOOK_TIMEOUT:-5.0}
      ALERT_WEBHOOK_MAX_ATTEMPTS: ${ALERT_WEBHOOK_MAX_ATTEMPTS:-3}
      ALERT_WEBHOOK_BACKOFF_SECONDS: ${ALERT_WEBHOOK_BACKOFF_SECONDS:-1.0}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c " alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 "

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  event-worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:-cloud_security_runtime}
      RLS_ENFORCEMENT_REQUIRED: ${RLS_ENFORCEMENT_REQUIRED:-true}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      ALERT_CONSOLE_NOTIFICATIONS: ${ALERT_CONSOLE_NOTIFICATIONS}
      ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_ORGANIZATION_ID: ${ALERT_WEBHOOK_ORGANIZATION_ID:-1}
      ALERT_WEBHOOK_TIMEOUT: ${ALERT_WEBHOOK_TIMEOUT:-5.0}
      ALERT_WEBHOOK_MAX_ATTEMPTS: ${ALERT_WEBHOOK_MAX_ATTEMPTS:-3}
      ALERT_WEBHOOK_BACKOFF_SECONDS: ${ALERT_WEBHOOK_BACKOFF_SECONDS:-1.0}
      EVENT_QUEUE_BATCH_SIZE: ${EVENT_QUEUE_BATCH_SIZE:-25}
      EVENT_QUEUE_POLL_SECONDS: ${EVENT_QUEUE_POLL_SECONDS:-2.0}
      EVENT_QUEUE_MAX_ATTEMPTS: ${EVENT_QUEUE_MAX_ATTEMPTS:-5}
      EVENT_QUEUE_LOCK_TIMEOUT_SECONDS: ${EVENT_QUEUE_LOCK_TIMEOUT_SECONDS:-300}
      EVENT_QUEUE_RETRY_BASE_SECONDS: ${EVENT_QUEUE_RETRY_BASE_SECONDS:-10}
      EVENT_QUEUE_ALERT_AGE_SECONDS: ${EVENT_QUEUE_ALERT_AGE_SECONDS:-300}
      EVENT_DATABASE_RETENTION_DAYS: ${EVENT_DATABASE_RETENTION_DAYS:-30}
      EVENT_RETENTION_CLEANUP_INTERVAL_SECONDS: ${EVENT_RETENTION_CLEANUP_INTERVAL_SECONDS:-3600}
      EVENT_RETENTION_CLEANUP_BATCH_SIZE: ${EVENT_RETENTION_CLEANUP_BATCH_SIZE:-500}
      EVENT_ARCHIVE_PROVIDER: ${EVENT_ARCHIVE_PROVIDER:-filesystem}
      EVENT_ARCHIVE_PATH: /var/lib/cloud-security/archive
      EVENT_ARCHIVE_RETENTION_DAYS: ${EVENT_ARCHIVE_RETENTION_DAYS:-365}
      EVENT_ARCHIVE_S3_BUCKET: ${EVENT_ARCHIVE_S3_BUCKET:-}
      EVENT_ARCHIVE_S3_PREFIX: ${EVENT_ARCHIVE_S3_PREFIX:-security-events}
      EVENT_ARCHIVE_S3_KMS_KEY_ID: ${EVENT_ARCHIVE_S3_KMS_KEY_ID:-}
    volumes:
      - event_archive_data:/var/lib/cloud-security/archive
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.workers.event_ingestion_worker"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend-tests:
    profiles: [ "test" ]
    build:
      context: ./backend
      target: test
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_RUNTIME_ROLE: ""
      RLS_ENFORCEMENT_REQUIRED: "false"
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      AUTH_ENABLED: "false"
      AUTH_COOKIE_SECURE: "false"
      EVENT_QUEUE_MAX_ATTEMPTS: "3"
      AWS_REGION: ${AWS_REGION}
      ALERT_CONSOLE_NOTIFICATIONS: "false"
      ALERT_WEBHOOK_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && pytest -q"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  event_archive_data:
