name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cloud_security_test
          POSTGRES_USER: cloud_security_test
          POSTGRES_PASSWORD: cloud-security-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud_security_test -d cloud_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: cloud_security_test
      POSTGRES_USER: cloud_security_test
      POSTGRES_PASSWORD: cloud-security-test-password
      PGPASSWORD: cloud-security-test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-test-secret-key-at-least-32-chars
      ENVIRONMENT: test
      DEBUG: "false"
      AUTH_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Verify latest migration round trip
        run: |
          alembic downgrade h37c00000008
          alembic upgrade head

      - name: Provision restricted runtime role
        run: >-
          psql --host 127.0.0.1 --username cloud_security_test
          --dbname cloud_security_test
          --file ../deployment/postgres/01-runtime-role.sql

      - name: Run backend tests
        run: pytest -q

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit Python production dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement backend/requirements.txt
              --ignore-vuln PYSEC-2026-1325
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build
      - dependency-audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t cloud-security-monitoring-backend:ci \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t cloud-security-monitoring-frontend:ci \
            ./frontend
