services:
  - type: web
    name: cloud-security-monitoring
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./deployment/render/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-security-monitoring-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RLS_ENFORCEMENT_REQUIRED
        value: "true"
      - key: DATABASE_RUNTIME_ROLE
        sync: false
      - key: EVENT_INGEST_API_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: METRICS_ENABLED
        value: "false"
      - key: PLATFORM_DIAGNOSTICS_ENABLED
        value: "false"
      - key: DEBUG
        value: "false"
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_BOOTSTRAP_ADMIN_USERNAME
        value: cloud-admin
      - key: AUTH_BOOTSTRAP_ADMIN_EMAIL
        value: cloud-admin@example.com
      - key: AUTH_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10"
      - key: AUTH_SESSION_EXPIRE_DAYS
        value: "7"
      - key: AUTH_MAX_FAILED_LOGINS
        value: "5"
      - key: AUTH_LOCKOUT_MINUTES
        value: "15"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: strict
      - key: AUTH_MFA_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_MFA_ISSUER
        value: Cloud Sentinel
      - key: AUTH_MFA_CHALLENGE_MINUTES
        value: "5"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "300"
      - key: AUTH_RATE_LIMIT_BLOCK_SECONDS
        value: "900"
      - key: AUTH_RATE_LIMIT_PRINCIPAL_ATTEMPTS
        value: "10"
      - key: AUTH_RATE_LIMIT_IP_ATTEMPTS
        value: "50"
      - key: AUTH_TRUSTED_PROXY_CIDRS
        value: 127.0.0.0/8
      - key: OIDC_ENABLED
        value: "false"
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: OIDC_SCOPES
        value: openid email profile
      - key: OIDC_ALLOWED_ALGORITHMS
        value: RS256
      - key: OIDC_ALLOW_EMAIL_LINKING
        value: "false"
      - key: OIDC_ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: ALERT_CONSOLE_NOTIFICATIONS
        value: "true"
      - key: ALERT_WEBHOOK_ENABLED
        value: "false"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_WEBHOOK_ORGANIZATION_ID
        value: "1"

  - type: worker
    name: cloud-security-event-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerContext: .
    dockerfilePath: ./deployment/render/Dockerfile
    dockerCommand: python -m app.workers.event_ingestion_worker
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-security-monitoring-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RLS_ENFORCEMENT_REQUIRED
        value: "true"
      - key: DATABASE_RUNTIME_ROLE
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: ALERT_CONSOLE_NOTIFICATIONS
        value: "true"
      - key: ALERT_WEBHOOK_ENABLED
        value: "false"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_WEBHOOK_ORGANIZATION_ID
        value: "1"
      - key: EVENT_QUEUE_BATCH_SIZE
        value: "25"
      - key: EVENT_QUEUE_POLL_SECONDS
        value: "2.0"
      - key: EVENT_QUEUE_MAX_ATTEMPTS
        value: "5"
      - key: EVENT_QUEUE_LOCK_TIMEOUT_SECONDS
        value: "300"
      - key: EVENT_QUEUE_RETRY_BASE_SECONDS
        value: "10"
      - key: EVENT_QUEUE_ALERT_AGE_SECONDS
        value: "300"
      - key: EVENT_DATABASE_RETENTION_DAYS
        value: "30"
      - key: EVENT_RETENTION_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      - key: EVENT_RETENTION_CLEANUP_BATCH_SIZE
        value: "500"
      - key: EVENT_ARCHIVE_PROVIDER
        value: s3
      - key: EVENT_ARCHIVE_RETENTION_DAYS
        value: "365"
      - key: EVENT_ARCHIVE_S3_BUCKET
        sync: false
      - key: EVENT_ARCHIVE_S3_PREFIX
        value: security-events
      - key: EVENT_ARCHIVE_S3_KMS_KEY_ID
        sync: false

databases:
  - name: cloud-security-monitoring-db
    plan: free
    region: singapore
    databaseName: cloud_security
    user: cloud_security
    ipAllowList: []
